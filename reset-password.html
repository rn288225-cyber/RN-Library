<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RN Library</title>
    <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<header class="navbar">
    <div class="logo">📚 RN Library</div>
    <a href="login.html" class="back-btn">← Back to Login</a>
</header>

<main class="auth-page">
    <section class="auth-card">

        <p class="section-tag">ACCOUNT RECOVERY</p>

        <h1>Reset Password</h1>

        <p class="auth-intro">
            Create a new password for your RN Library account.
        </p>

        <form id="resetPasswordForm" method="POST" action="reset-password.php">

            <label for="resetEmail">Registered Email</label>

            <input
                type="email"
                id="resetEmail"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <label for="resetToken">Reset Token</label>

            <input
                type="text"
                id="resetToken"
                name="token"
                placeholder="Enter your reset token"
                required
            >

            <label for="newPassword">New Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="newPassword"
                    name="password"
                    placeholder="Create a new password"
                    minlength="6"
                    required
                >
                <button type="button" id="toggleNewPassword">👁️</button>
            </div>

            <label for="confirmNewPassword">Confirm New Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="confirmNewPassword"
                    name="confirm_password"
                    placeholder="Confirm your new password"
                    minlength="6"
                    required
                >
                <button type="button" id="toggleConfirmNewPassword">👁️</button>
            </div>

            <button type="submit" class="auth-submit">
                Reset Password
            </button>

        </form>

        <p class="auth-switch">
            Remember your password?
            <a href="login.html">Login</a>
        </p>

    </section>
</main>

<footer>
    <p>© 2026 RN Library. All rights reserved.</p>
</footer>

<script>
function setupPasswordToggle(inputId, buttonId) {
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);

    button.addEventListener("click", function () {
        if (input.type === "password") {
            input.type = "text";
            this.textContent = "🙈";
        } else {
            input.type = "password";
            this.textContent = "👁️";
        }
    });
}

setupPasswordToggle("newPassword", "toggleNewPassword");
setupPasswordToggle("confirmNewPassword", "toggleConfirmNewPassword");
</script>

</body>
</html>
