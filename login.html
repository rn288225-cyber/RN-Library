<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RN Library</title>
    <link rel="stylesheet" href="css/style.css?v=7">
</head>

<body>

    <header class="navbar">
        <div class="logo">📚 RN Library</div>
        <a href="index.html" class="back-btn">← Back to Library</a>
    </header>

    <main class="auth-page">

        <section class="auth-card">

            <p class="section-tag">WELCOME BACK</p>

            <h1>Login to RN Library</h1>

            <p class="auth-intro">
                Sign in to access your library account.
            </p>

            <div id="loginError" style="display:none;margin-bottom:15px;padding:12px;border-radius:10px;background:#fee2e2;color:#b91c1c;font-weight:600;">
    Invalid email or password.
</div>

<form id="loginForm" method="POST" action="login.php">

                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail" name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="loginPassword" name="password"
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button" id="toggleLoginPassword">👁️</button>
                </div>

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                <a href="forgot-password.html">Forgot Password?</a>
            </p>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 RN Library. All rights reserved.</p>
    </footer>

<script>
const loginPassword = document.getElementById("loginPassword");
const toggleLoginPassword = document.getElementById("toggleLoginPassword");

toggleLoginPassword.addEventListener("click", function () {
    if (loginPassword.type === "password") {
        loginPassword.type = "text";
        this.textContent = "🙈";
    } else {
        loginPassword.type = "password";
        this.textContent = "👁️";
    }
});

const params = new URLSearchParams(window.location.search);
if (params.get("error") === "invalid") {
    document.getElementById("loginError").style.display = "block";
}
</script>
</body>
</html>
