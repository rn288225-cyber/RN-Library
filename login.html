<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RN Library</title>
    <link rel="stylesheet" href="css/style.css?v=7">
</head>

<body>

    <header class="navbar">
        <div class="logo">📚 RN Library</div>
        <a href="index.html" class="back-btn">← Back to Library</a>
    </header>

    <main class="auth-page">

        <section class="auth-card">

            <p class="section-tag">WELCOME BACK</p>

            <h1>Login to RN Library</h1>

            <p class="auth-intro">
                Sign in to access your library account.
            </p>

            <form id="loginForm">

                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 RN Library. All rights reserved.</p>
    </footer>

</body>
</html>
